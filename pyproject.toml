[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbrain"
version = "0.1.0"
description = "Multi-agent crypto trading bot with a quantum-inspired optimizer (paper trading by default)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "ccxt>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
qbrain = "qbrain.cli:main"

[tool.setuptools]
packages = ["qbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
